name: Restore drill

# Ship List v2 Wave 2 Phase 3: server/scripts/restore-drill.ts already proves
# a single restore is clean when run by hand (pnpm --filter server
# restore-drill, docs/RESTORE_DRILL.md's existing rows). What was missing was
# a SCHEDULE -- a restore drill nobody runs regularly proves nothing about
# whether restores still work next month. This workflow runs the same
# script weekly (plus on-demand via workflow_dispatch). The drill's own
# exit code is the signal: a failed restore or a violated ledger invariant
# fails this workflow, which is what turns "nobody ran it" into a surprise
# during a real incident.
#
# It used to commit the dated log row back to docs/RESTORE_DRILL.md. It no
# longer does: docs/ is untracked and gitignored, so the row would either
# fail to stage or have to be force-added, which would republish the very
# file the ignore exists to keep private. The row is still written inside
# the runner (visible in the step's log output) and, when the drill is run
# by hand locally, appended to the local docs/RESTORE_DRILL.md as before.
#
# Deliberately NOT wired into the app's own in-process singleton-job
# pattern (sweeper.ts/tripwire.ts's pg_try_advisory_xact_lock jobs) --
# restore-drill.ts shells out to `docker run`/`docker compose exec` and
# takes tens of seconds per run (container startup + a real pg_dump/psql
# round trip), which is a fundamentally different shape from those jobs'
# sub-second periodic DB queries. A scheduled CI job is the right host for
# an operation this heavy, matching how ci.yml already runs migrate/test
# against a docker-compose-launched db, not GH Actions' native `services:`
# (restore-drill.ts's `docker compose exec -T db ...` calls need the actual
# compose service, not a bare service container).

on:
  schedule:
    # 04:17 UTC every Monday -- an off-the-hour time, matching the general
    # advice against scheduling CI on exact hour/day boundaries where every
    # other repo's cron also fires.
    - cron: "17 4 * * 1"
  workflow_dispatch: {}

# Least-privilege default (matches ci.yml). Nothing here writes to the repo.
permissions:
  contents: read

jobs:
  restore-drill:
    name: Dump, restore into a throwaway container, check invariants
    runs-on: ubuntu-latest
    permissions:
      contents: read # nothing is committed back -- see the header comment
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # this job pushes nothing

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.15.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same ephemeral-secret pattern as ci.yml's test job -- a fresh
      # JWT_SECRET/APP_DB_PASSWORD per run, never a static committed value.
      - name: Generate ephemeral secrets and write .env
        run: |
          JWT_SECRET=$(openssl rand -hex 32)
          APP_DB_PASSWORD=$(openssl rand -hex 16)
          echo "::add-mask::$JWT_SECRET"
          echo "::add-mask::$APP_DB_PASSWORD"
          cat > .env <<EOF
          POSTGRES_DB=tappay
          POSTGRES_USER=tappay
          POSTGRES_PASSWORD=tappay
          DATABASE_URL=postgres://tappay:tappay@localhost:5433/tappay
          APP_DB_PASSWORD=${APP_DB_PASSWORD}
          APP_DATABASE_URL=postgres://tappay_app:${APP_DB_PASSWORD}@localhost:5433/tappay
          SERVER_PORT=3000
          JWT_SECRET=${JWT_SECRET}
          EOF

      # restore-drill.ts's dump step is `docker compose exec -T db
      # pg_dump ...` -- it needs the real compose service up, not just a
      # database reachable on the same port.
      - name: Start db via docker compose
        run: |
          docker compose up -d db
          timeout 60 sh -c 'until docker compose exec -T db pg_isready -U tappay -d tappay; do sleep 2; done'

      - name: Migrate + seed (real, non-trivial data to restore and check)
        run: |
          pnpm --filter server migrate
          pnpm --filter server seed

      - name: Run the restore drill
        run: pnpm --filter server restore-drill
