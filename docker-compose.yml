services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: tappay
      POSTGRES_USER: tappay
      POSTGRES_PASSWORD: tappay
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: dev@tappay.local
      PGADMIN_DEFAULT_PASSWORD: tappay
    ports: ["5050:80"]
    depends_on: [db]

  telemetry:
    build: ./telemetry
    ports: ["8080:8080"]
    volumes:
      - "./telemetry/data:/app/data"
      - "./telemetry/app:/app/app"
      - "./telemetry/analysis:/app/analysis"

  server:
    build: ./server
    profiles: ["integration"]
    env_file: .env
    ports: ["3000:3000"]
    depends_on: [db]

volumes:
  pgdata:
